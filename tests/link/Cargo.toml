[package]
name = "hyper-vm-support-shared-link-test"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[workspace]
resolver = "3"

[dependencies]

[dependencies.hyper-vm-support-shared]
path = "../../shared"
default-features = false
features = []

[profile]

[profile.release]
codegen-units = 1
debug = 1
incremental = false
lto = "fat"
opt-level = "s"
overflow-checks = true
panic = "abort"
strip = "none"
